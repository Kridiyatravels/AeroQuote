<!DOCTYPE html>
<html>

<head>
    <title>AeroQuote</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>AeroQuote</h1>
    <h2>Flight Quotation Generator</h2>
    <p>create flight quotes easily</p>
    <form id="quote-form">
        <label>
            <input type="radio" name="trip-type" value="one-way" checked>
            One Way
        </label>
        <label>
            <input type="radio" name="trip-type" value="round-trip">
            Round Trip
        </label>
                <button type="button" id="passenger-toggle">1 Adult</button>
                <div id="passenger-details" hidden>
<h3>Passengers</h3>
<label for="adults">Adults (12+years)</label>
<div class="counter">
    <button type="button" id="adults-minus">-</button>
    <input type="number" id="adults" min="1" max="9" value="1" step="1" readonly>
    <button type="button" id="adults-plus">+</button>
    </div>
    <label for="children">Children (2-11 years)</label>
    <div class="counter">
        <button type="button" id="children-minus">-</button>
        <input type="number" id="children" min="0" max="8" value="0" step="1" readonly>
        <button type="button" id="children-plus">+</button>
    </div>
     <label for="infants">Infants (under 2 years)</label>
    <div class="counter">
        <button type="button" id="infants-minus">-</button>
        <input type="number" id="infants" min="0" max="9" value="0" step="1" readonly>
        <button type="button" id="infants-plus">+</button>
    </div>
    <button type="button" id="passenger-done">Done</button>
    </div>
        <label for="airline">Airline name:</label>
        <input type="text" id="airline" name="airline">
        <label for="departure">Departure City:</label>
        <input type="text" id="departure" name="departure">
        <label for="destination">Destination City:</label>
        <input type="text" id="destination" name="destination">
        <label for="departure-date">Departure Date:</label>
        <input type="date" id="departure-date" name="departure-date">
        <label for="ticket-price">Ticket Price (AED):</label>
        <input type="number" id="ticket-price" name="ticket-price" min="0" step="0.01">
        <label for="service-charge">Service Charge (AED):</label>
        <input type="number" id="service-charge" name="service-charge" min="0" step="0.01">
        <label for="baggage">Baggage Allowance (kg):</label>
        <input type="text" id="baggage" name="baggage">
        <label for="departure-time">Departure Time:</label>
        <input type="time" id="departure-time" name="departure-time">
        <label for="arrival-date">Arrival Date:</label>
        <input type="date" id="arrival-date" name="arrival-date">
        <label for="arrival-time">Arrival Time:</label>
        <input type="time" id="arrival-time" name="arrival-time">


        <div id="return-flight" hidden>
            <h3>Return Flight</h3>
            <label for="return-airline">Return Airline:</label>
            <input type="text" id="return-airline" name="return-airline">
            <label for="return-departure">Return Departure:</label>
            <input type="text" id="return-departure" name="return-departure">
            <label for="return-destination">Return Destination City:</label>
            <input type="text" id="return-destination" name="return-destination">
            <label for="return-departure-date">Return Departure Date:</label>
            <input type="date" id="return-departure-date" name="return-departure-date">
            <label for="return-departure-time">Return Departure Time:</label>
            <input type="time" id="return-departure-time" name="return-departure-time">
            <label for="return-arrival-date">Return Arrival Date:</label>
            <input type="date" id="return-arrival-date" name="return-arrival-date">
            <label for="return-arrival-time">Return Arrival Time:</label>
            <input type="time" id="return-arrival-time" name="return-arrival-time">
        </div>
        <button type="button" id="generate-quotation">Generate Quotation</button>
    </form>
    <h2>Flight Quotation</h2>
    <pre id="quote-result">your quote will appear here.</pre>
</body>

</html>
