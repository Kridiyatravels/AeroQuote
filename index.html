<!DOCTYPE html>
<html>
    <head>
        <title>AeroQuote</title>
    </head>
    <body>
        <h1>AeroQuote</h1>
        <h2>Flight Quotation Generator</h2>
        <p>create flight quotes easily</p>
        <label for="airline">Airline name:</label>
        <input type="text" id="airline" name="airline">
        <label for="departure">Departure City:</label>
        <input type="text" id="departure" name="departure">
        <label for="destination">Destination City:</label>
        <input type="text" id="destination" name="destination">
        <label for="travel">Travel Date:</label>
        <input type="date" id="travel" name="travel">    
        <label for="ticket-price">Ticket Price (AED):</label>
        <input type="number" id="ticket-price" name="ticket-price" min="0" step="0.01">
        <label for="service-charge">Service Charge (AED):</label>
        <input type="number" id="service-charge" name="service-charge" min="0" step="0.01">
        <label for="baggage">Baggage Allowance (KG):</label>
        <input type="text" id="baggage" name="baggage">
    </body>
</html>
